# ─────────────────────────────────────────────────────────
# eclipse-mosquitto Broker 設定
# 對應需求 (2.1 Mqtt Broker.md)：
#   1. 對外連線  → listener bind 0.0.0.0 (+ 你可再用 ngrok http 對外)
#   2. 密碼驗證  → password_file + allow_anonymous false
#   3. 傳輸加密  → Websocket(WSS) 可由免費 ngrok https tunnel 達成；
#                  若要走原生 TLS(MQTT over TLS) 請見文件底部註解。
# 本機跑法請看 /mosquitto/README。
# ─────────────────────────────────────────────────────────

# ---- 帳號密碼驗證（要求 2）----
password_file /mosquitto/config/passwd
allow_anonymous false

# ---- 持久化 ----
persistence true
persistence_file mosquitto.db
persistence_location /mosquitto/data/

# ---- Listener 1: 原生 MQTT（明文 TCP）----
# 用途：同一內網 / VPN 內的 beacons 與 server 使用（例如樹莓派）。
# 注意：為「明文」，僅限內網或經 VPN；若要跨越不信任網路請改用 TLS。
listener 1883 0.0.0.0

# ---- Listener 2: MQTT over WebSocket（9001，明文 ws）----
# 用途：Web 端 / 可走 WS 的 client。
# 對外：
#   - 若要加密，請對這支 listener 跑免費 ngrok https tunnel：
#       ngrok http 9001
#     client 連 wss://<your-ngrok>.ngrok.app （加密由 ngrok 提供）。
listener 9001 0.0.0.0
protocol websockets

# ─────────────────────────────────────────────────────────
# （選用）原生 TLS — MQTT over TLS
# 若你之後要「不靠 ngrok」直接對外加密，可解除下列註解並產生憑證：
#
# listener 8883 0.0.0.0
# cafile   /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile  /mosquitto/certs/server.key
#
# listener 9883 0.0.0.0
# protocol websockets
# cafile   /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile  /mosquitto/certs/server.key
# ─────────────────────────────────────────────────────────

# ---- 紀錄 ----
log_type subscribe
log_type unsubscribe
log_type websockets
log_type error
log_type warning
log_type notice
log_type information
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
